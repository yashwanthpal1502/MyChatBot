services:
  yashu:
    build: .
    ports:
      - "127.0.0.1:${YASHU_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - yashu-data:/app/data
    restart: unless-stopped

volumes:
  yashu-data: